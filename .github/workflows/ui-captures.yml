name: UI captures

# C2 (docs/CLOUD_AND_CICD_PLAN.md). Serve the real app with the released
# bulletin store, capture every route at five viewports in headless Chrome,
# and fail on horizontal overflow, a console error, an uncaught exception or a
# failed request. The PNGs are uploaded as an artifact for review. No pixel
# diff: software-rendered WebGL varies between runners.

on:
  pull_request:
    paths:
      - "web/**"
      - "src/fbd/api/**"
      - "scripts/capture_screenshots.py"
      - "scripts/check_captures.py"
      - ".github/workflows/ui-captures.yml"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "src/fbd/api/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  FBD_GENAI_ENABLED: "0"

jobs:
  captures:
    name: Capture every view, fail on layout or runtime errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the serving set and the DevTools client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt "websocket-client==1.9.0"

      # bulletins.sqlite is gitignored and ships as a checksum-verified
      # Release asset (DATA.md); without it every view would render empty.
      - name: Fetch the released bulletin store
        run: python scripts/fetch_release_artifacts.py

      - name: Serve the app
        run: |
          python -m uvicorn fbd.api.app:app --app-dir src --port 8912 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8912/api/health >/dev/null 2>&1 && break
            [ "$i" -eq 30 ] && { cat server.log; exit 1; }
            sleep 1
          done

      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which
      # Chrome's sandbox needs; relax it for this job only instead of
      # launching Chrome with --no-sandbox.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Capture
        run: python scripts/capture_screenshots.py --label ci

      - name: Check
        run: python scripts/check_captures.py artifacts/frontend/ci/report.json

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-captures
          path: |
            artifacts/frontend/ci/
            server.log
          retention-days: 14
